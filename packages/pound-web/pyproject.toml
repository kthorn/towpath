[project]
name = "pound-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pound-core",
  "fastapi>=0.142.2,<0.143",
  "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
pound-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pound_web"]
