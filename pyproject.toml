[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "integration-tests"]
pythonpath = ["."]
markers = [
  "network: tests that hit the live Overpass API (deselect by default; use --run-network)",
  "bulk: tests needing pyosmium / osmium-tool (deselect by default; use --run-bulk)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
