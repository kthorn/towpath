---
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    groups:
      vite-tooling:
        patterns:
          - vite
          - "@sveltejs/vite-plugin-svelte"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
