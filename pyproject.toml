[project]
name = "pound"
version = "0.1.0"
description = "Pound — deterministic routing engine for UK inland waterways"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<0.117",
  "flask>=3.1,<4",
  "pydantic>=2.11",
  "requests>=2.31",          # offline ingest ONLY; never on the request-time path
  "networkx>=3.3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
bulk = ["osmium>=3.7"]

[project.scripts]
pound-ingest = "pound.ingest.cli:main"
pound-plan = "pound.route.cli:main"
pound-locate = "pound.route.locate_cli:main"
pound-boat-review = "pound.review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pound"]
exclude = ["pound/artifacts/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that hit the live Overpass API (deselect by default; use --run-network)",
  "bulk: tests needing pyosmium / osmium-tool (deselect by default; use --run-bulk)",
]
addopts = "-ra"
