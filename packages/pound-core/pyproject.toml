[project]
name = "pound-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "networkx>=3.3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
]

[project.scripts]
pound-plan = "pound.route.cli:main"
pound-locate = "pound.route.locate_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pound"]
