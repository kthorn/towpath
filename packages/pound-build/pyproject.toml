[project]
name = "pound-build"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pound-core",
  "flask>=3.1,<4",
  "requests>=2.31",
]

[project.optional-dependencies]
bulk = ["osmium>=3.7"]

[project.scripts]
pound-ingest = "pound_build.ingest.cli:main"
pound-boat-review = "pound_build.review.cli:main"

[tool.uv.sources]
pound-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pound_build"]
